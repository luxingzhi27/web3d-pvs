# FileBrowser and the PVS runtime benchmark share the IP-address TLS certificate.
server {
    listen 443 ssl http2 default_server;
    server_name 139.196.34.161;

    include snippets/ssl-139.196.34.161.conf;

    client_max_body_size 8m;

    location = /pvs-runtime {
        return 301 /pvs-runtime/;
    }

    location = /pvs-runtime/ {
        return 302 /pvs-runtime/runtime-benchmark.html;
    }

    location ^~ /pvs-runtime/ {
        alias /var/www/pvs-runtime-benchmark/public/;
        add_header Cache-Control "public, max-age=3600";
    }

    location = /api/pvs-runtime-session {
        proxy_pass http://127.0.0.1:8321;
        include snippets/proxy-common.conf;
    }

    location = /api/pvs-runtime-results {
        proxy_pass http://127.0.0.1:8321;
        include snippets/proxy-common.conf;
    }

    location = /api/pvs-runtime-health {
        proxy_pass http://127.0.0.1:8321;
        include snippets/proxy-common.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:19002;
        include snippets/proxy-common.conf;
    }
}
