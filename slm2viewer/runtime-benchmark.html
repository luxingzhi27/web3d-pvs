<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>PVS V4 WebGPU 推理测试</title>
  <link rel="shortcut icon" href="assets/favicon.ico">
  <link rel="stylesheet" href="runtime-benchmark.css">
  <script src="src/PVSRuntimeBenchmark.js"></script>
</head>
<body>
  <main class="benchmark-shell">
    <header class="page-header">
      <div>
        <p class="eyebrow">PVS V4 Runtime Benchmark</p>
        <h1>WebGPU 候选推理测试</h1>
      </div>
      <span id="secure-status" class="status-badge">环境检查中</span>
    </header>

    <section class="controls" aria-labelledby="setup-title">
      <h2 id="setup-title">设备登记</h2>
      <div class="form-grid">
        <label>
          <span>设备名称</span>
          <input id="device-label" autocomplete="off" placeholder="例如 MacBook Air M2" required>
        </label>
        <label>
          <span>设备型号 / GPU</span>
          <input id="device-model" autocomplete="off" placeholder="例如 Apple M2 8-core GPU">
        </label>
        <label>
          <span>测试轮数</span>
          <select id="session-count">
            <option value="1">1 轮（快速检查）</option>
            <option value="5" selected>5 轮（论文正式测试）</option>
          </select>
        </label>
      </div>
      <div class="actions">
        <button id="start-button" class="primary" type="button" disabled>开始测试</button>
        <button id="stop-button" type="button" disabled>停止</button>
        <button id="download-button" type="button" disabled>下载结果</button>
      </div>
    </section>

    <section class="runtime-status" aria-labelledby="runtime-title">
      <h2 id="runtime-title">运行状态</h2>
      <dl class="status-grid">
        <div><dt>后端</dt><dd id="backend-value">-</dd></div>
        <div><dt>WebGPU Adapter</dt><dd id="adapter-value">-</dd></div>
        <div><dt>计时源</dt><dd id="timing-source-value">-</dd></div>
        <div><dt>固定负载</dt><dd id="workload-value">加载中</dd></div>
        <div><dt>模型资产初始化</dt><dd id="init-value">尚未开始</dd></div>
        <div><dt>上传状态</dt><dd id="upload-value">尚未上传</dd></div>
      </dl>
      <div class="progress-row">
        <progress id="progress" max="1" value="0"></progress>
        <span id="progress-text">等待开始</span>
      </div>
    </section>

    <section class="results" aria-labelledby="results-title">
      <h2 id="results-title">本机结果</h2>
      <table>
        <thead>
          <tr>
            <th>轮次</th>
            <th>样本数</th>
            <th>候选数均值</th>
            <th>模型推理 p50</th>
            <th>模型推理 p95</th>
          </tr>
        </thead>
        <tbody id="results-body">
          <tr><td colspan="5" class="empty">尚无结果</td></tr>
        </tbody>
      </table>
      <p id="message" class="message" role="status"></p>
    </section>
  </main>
</body>
</html>
